# West manifest: imports the shared Argus board, its Zephyr pin, and modules.
# Set up a workspace with:
#   west init -m https://github.com/cmu-argus-2/FSW-Mainboard-C --mr main <workspace-dir>
#   cd <workspace-dir> && west update

manifest:
  remotes:
    - name: argus
      url-base: https://github.com/cmu-argus-2

  projects:
    - name: FSW-Zephyr-Board-Lib
      remote: argus
      # Temporary pin to FSW-Zephyr-Board-Lib PR #2. Update to its merge commit
      # before this application PR is merged.
      revision: 4483fe67a5bf866f25d9d3c5868d3a2e10f0aeaa
      import: true

  self:
    path: FSW-Mainboard-C
