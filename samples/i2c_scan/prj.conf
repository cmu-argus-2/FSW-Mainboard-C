CONFIG_I2C=y
CONFIG_LOG=y
# Pico die temp driver needs the ADC node enabled; off until we use it
CONFIG_RPI_PICO_TEMP=n

# Every empty address makes the I2C driver log "NACK on ..." and "IO Fail on ...". Those
# use rate-limited log macros, which this drops entirely. "ARB lost" and "Stuck Low" use
# plain error logs and still print, since they point at a fault on the bus.
CONFIG_LOG_RATELIMIT=n
CONFIG_LOG_RATELIMIT_FALLBACK_DROP=y
