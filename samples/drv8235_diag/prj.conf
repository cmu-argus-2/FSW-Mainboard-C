CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_REGULATOR=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Keep the diagnostic's command line usable over the board's USB CDC console.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=3072
