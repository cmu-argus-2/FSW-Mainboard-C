CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_LOG=y
# printk and log lines go straight to USB instead of through the 1 KB deferred
# buffer, which overflowed at start-up and dropped the init and fault lines
CONFIG_LOG_MODE_IMMEDIATE=y
# printk of the float columns
CONFIG_CBPRINTF_FP_SUPPORT=y
# Wait for the capture to open the USB port (DTR) before starting
CONFIG_UART_LINE_CTRL=y
# Pico die temp driver needs the ADC node enabled; off until we use it
CONFIG_RPI_PICO_TEMP=n
CONFIG_MAIN_STACK_SIZE=2048
