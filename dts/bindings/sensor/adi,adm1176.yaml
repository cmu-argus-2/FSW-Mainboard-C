description: |
  Analog Devices ADM1176 hot-swap controller and I2C power monitor.

  The device measures bus voltage and the voltage across an external shunt
  resistor with a 12-bit ADC. The driver exposes voltage, current, and
  calculated power through Zephyr's sensor API.

compatible: "adi,adm1176"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  rshunt-micro-ohms:
    type: int
    required: true
    description: External current-sense resistor value in micro-ohms.

  voltage-range-microvolt:
    type: int
    default: 26350000
    enum: [6650000, 26350000]
    description: |
      Full-scale bus-voltage range in microvolts. The default preserves the
      26.35 V range used by the previous Argus flight driver. Set 6650000 to
      enable the ADM1176 VRANGE bit and use the higher-resolution 6.65 V range.
