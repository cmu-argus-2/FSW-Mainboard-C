# SPDX-License-Identifier: Apache-2.0

description: |
  Test-only DRV8235 binding for the I2C register emulator. This declares the
  properties consumed by the real driver without importing the Argus board
  library. Bus addresses, rail setup, and explicit limits belong to the test
  overlays, not this schema. Keep property types aligned with the hardware
  binding; this fixture does not validate the production board definition.

compatible: "ti,drv8235"

include: i2c-device.yaml

properties:
  vm-supply:
    type: phandle
    required: true

  max-output-microvolt:
    type: int
    required: true

  coil-resistance-milliohm:
    type: int
    required: true

  imtr-full-scale-microamp:
    type: int
    required: true
