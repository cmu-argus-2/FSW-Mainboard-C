CONFIG_LED_STRIP=y
CONFIG_I2C=y
CONFIG_FUEL_GAUGE=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y
CONFIG_SENSOR=y
# The RP2350 die-temperature node is enabled by the SoC DTS, but the Argus
# board does not enable its ADC. It is unrelated to the external ADM1176s.
CONFIG_RPI_PICO_TEMP=n
CONFIG_LOG=y
